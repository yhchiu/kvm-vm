# Overlay the existing local Prometheus mount; keep Grafana and named volumes.
services:
  prometheus:
    volumes:
      - ./prometheus-hybrid.yml:/etc/prometheus/prometheus.yml:ro
      - ./remote-password:/etc/prometheus/remote-password:ro
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true
