# Include the map in nginx http context, and the locations in a dedicated TLS
# server. Do not mix with the legacy ingestion location. See the operator guide.
# Username structure: immutable host UUID + '.' + random credential ID.
map $remote_user $kvm_vm_bound_host {
    default "";
    "~^(?<kvm_bound_uuid>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.[0-9a-f]{24}$" $kvm_bound_uuid;
}
