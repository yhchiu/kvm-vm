groups:
  - name: kvm-vm-availability
    rules:
      # The registered/expected inventory remains available when a Host stops
      # pushing metrics entirely. Last seen within five minutes suppresses the
      # alert; a further five-minute 'for' window reduces flapping.
      - alert: KvmVmHostOffline
        expr: kvm_vm_host_expected unless on(host_id) max by(host_id) (count_over_time(kvm_vm_collector_success[5m]))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Expected KVM host {{ $labels.host }} ({{ $labels.site }}) is not reporting'
          description: 'Check host network, collector and remote-write queue; disable inventory during scheduled maintenance.'
      - alert: KvmVmInventoryScrapeFailed
        expr: up{job="kvm-vm-inventory"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Central KVM host inventory exporter is unavailable'
      - alert: KvmVmCollectorFailure
        expr: kvm_vm_collector_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'VM metrics collection failing on {{ $labels.host }}'
      - alert: KvmVmAgentQueueGrowing
        expr: delta(vmagent_remotewrite_pending_data_bytes[10m]) > 104857600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Remote write queue growth on {{ $labels.host }}'
# Host disappearance needs a persistent enrollment inventory; a host that
# disappears entirely produces no new time series. Do not infer up==0.
      - alert: KvmVmHostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Low available memory on host {{ $labels.host }}'
      - alert: KvmVmHostDiskFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Host {{ $labels.host }} filesystem {{ $labels.mountpoint }} low on space'
  - name: kvm-vm-delivery-health
    rules:
      - alert: KvmVmAgentQueueDataDiscarded
        expr: sum by(host_id,host,site) (increase(vm_persistentqueue_bytes_dropped_total{job="vmagent"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: 'Agent persistent queue discarded bytes on {{ $labels.host }}'
      - alert: KvmVmAgentWriteRejected
        expr: sum by(host_id,host,site) (increase(vmagent_remotewrite_packets_dropped_total{job="vmagent"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: 'Agent remote write rejected blocks on {{ $labels.host }}'
      - alert: KvmVmAgentSamplesDropped
        expr: sum by(host_id,host,site) (increase(vmagent_remotewrite_samples_dropped_total{job="vmagent"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: 'Agent discarded samples on {{ $labels.host }}'
      - alert: KvmVmHybridWriteFailed
        expr: sum by(host_id,host,site) (increase(prometheus_remote_storage_samples_failed_total{job="prometheus-writer"}[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: 'Hybrid remote write permanently failed samples on {{ $labels.host }}'
      - alert: KvmVmHybridWriteLag
        expr: (prometheus_remote_storage_queue_highest_timestamp_seconds{job="prometheus-writer"} - prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="prometheus-writer"}) > 120
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Hybrid writer lag on {{ $labels.host }}'
      - alert: KvmVmCollectorDataDelayed
        expr: (time() - timestamp(kvm_vm_collector_success)) > 120
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Collector data delayed on {{ $labels.host }} (check transport and clock)'
      - alert: KvmVmCentralComponentScrapeFailed
        expr: up{job="kvm-vm-central-components",host_id=""} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Central component {{ $labels.instance }} unreachable'
      - alert: KvmVmCentralStorageLowSpace
        expr: vm_free_disk_space_bytes{job="kvm-vm-central-components",instance="victoriametrics:8428",host_id=""} < 1073741824
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Central VictoriaMetrics storage has less than 1 GiB free'
