name: kvm-vm-central
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VM_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -promscrape.config=/etc/victoriametrics/scrape.yml
    ports:
      - 127.0.0.1:${VM_PORT:-8428}:8428
    volumes:
      - vm_data:/storage
      - ./inventory/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    security_opt:
      - no-new-privileges:true

  inventory:
    image: python:3.13-alpine
    restart: unless-stopped
    user: "65534:65534"
    command:
      - python3
      - /inventory/inventory.py
      - --file
      - /inventory/hosts.json
      - serve
      - --bind
      - 0.0.0.0
      - --port
      - "9187"
    volumes:
      - ./inventory:/inventory:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      - victoriametrics
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set initial Grafana password}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fleet.json
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true

  vmalert:
    image: victoriametrics/vmalert:v1.154.1
    restart: unless-stopped
    depends_on:
      - victoriametrics
      - alertmanager
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -rule=/etc/vmalert/rules.yml
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=30s
      - -httpListenAddr=:8880
    volumes:
      - ./rules/rules.yml:/etc/vmalert/rules.yml:ro
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    security_opt:
      - no-new-privileges:true

volumes:
  vm_data:
  grafana_data:
