# Example location blocks inside an HTTPS server configured with a valid cert.
# Use dedicated HTTPS virtual host, NOT the default Grafana virtual host.
# Install /etc/nginx/kvm-vm/htpasswd, and give the nginx worker read access.
# VictoriaMetrics itself is bound to localhost on the host.
location = /api/v1/write {
    limit_except POST { deny all; }
    auth_basic "kvm-vm host remote write";
    auth_basic_user_file /etc/nginx/kvm-vm/htpasswd;
    client_max_body_size 32m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8428/api/v1/write;
}
location / {
    return 404;
}
