version: 1

# For `kvm-vm clone`, storage.image is intentionally omitted: the source VM's
# system disk is copied, sysprepped, and then this target identity is applied.
vm:
  name: web02
  vcpus: 4
  memory_mib: 8192
  cpu: host-passthrough
  autostart: true
  start: true

storage:
  # Optional for clone. Omit to preserve the source virtual disk size.
  disk_gib: 100
  bus: virtio
  cache: none
  discard: unmap

network:
  mode: bridge
  bridge: br0
  mac: auto
  ipv4:
    method: static
    address: 192.168.10.52/24
    gateway: 192.168.10.1
    dns:
      - 192.168.10.1
      - 1.1.1.1

cloud_init:
  user: admin
  ssh_authorized_keys:
    - file:~/.ssh/id_ed25519.pub
  qemu_guest_agent: true
  timezone: Asia/Taipei
