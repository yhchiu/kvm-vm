version: 1

vm:
  name: debian01
  vcpus: 2
  memory_mib: 4096
  cpu: host-passthrough
  autostart: true
  start: true

storage:
  disk_gib: 40
  image:
    distro: debian13

network:
  mode: bridge
  bridge: br0
  mac: auto
  ipv4:
    method: dhcp
  ipv6:
    method: disabled

cloud_init:
  user: admin
  ssh_authorized_keys:
    - file:/root/.ssh/id_ed25519.pub
  qemu_guest_agent: true
  timezone: Asia/Taipei
