version: 1

vm:
  name: nat01
  vcpus: 2
  memory_mib: 4096
  cpu: host-passthrough
  autostart: true
  start: true
  os_variant: ubuntu24.04

storage:
  disk_gib: 40
  image:
    distro: ubuntu24.04

network:
  mode: nat
  # A libvirt virtual network whose <forward mode="nat"/> is enabled.
  # "default" normally uses virbr0 + dnsmasq and provides outbound NAT.
  libvirt_network: default
  model: virtio
  mac: auto
  ipv4:
    method: dhcp
  ipv6:
    method: disabled

cloud_init:
  user: admin
  ssh_authorized_keys:
    - file:~/.ssh/id_ed25519.pub
  qemu_guest_agent: true
  timezone: Asia/Taipei
