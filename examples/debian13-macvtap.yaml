# debian13 / macvtap / DHCP. Review VM name and network before creating.
version: 1

vm:
  name: debian13-macvtap01
  vcpus: 2
  memory_mib: 4096
  cpu: host-passthrough
  machine: q35
  autostart: true
  start: true

storage:
  disk_gib: 40
  bus: virtio
  cache: none
  discard: unmap
  image:
    distro: debian13

network:
  mode: macvtap
  # Replace eno1 with the host Ethernet interface (or set KVM_VM_MACVTAP).
  # Macvtap normally cannot communicate directly with the host.
  parent: eno1
  model: virtio
  mac: auto
  ipv4:
    method: dhcp
  ipv6:
    method: disabled

cloud_init:
  maintenance:
    profile: balanced
  user: admin
  ssh_authorized_keys:
    - file:~/.ssh/id_ed25519.pub
  qemu_guest_agent: true
  timezone: Asia/Taipei
